{"openapi":"3.1.0","info":{"title":"Invoice & Payment Service","version":"1.0.0","description":"A minimal invoice & payment service. A business creates invoices for its\ncustomers, customers pay them through a payment processor, and the business\nis notified of state changes via signed webhooks.\n\n## Authentication\n\nEvery endpoint except `GET /healthz` requires `Authorization: Bearer <credential>`.\nThere are two kinds of credential:\n\n- **API keys** (`sk_...`) \u2014 long-lived, created with a permission list.\n  Used for all day-to-day endpoints.\n- **Critical-tier tokens** \u2014 short-lived JWTs (15 min) minted from an API\n  key via `POST /auth/tokens`. The endpoints that mint secrets\n  (`POST /api_keys`, `DELETE /api_keys/{id}`, `POST /webhook_endpoints`,\n  `DELETE /webhook_endpoints/{id}`) accept **only** these tokens; a plain\n  API key gets `403 jwt_required`. Minting can only *narrow*: a token may\n  carry a subset of its key's permissions, never more.\n\n## Permissions\n\nA credential carries a list of `resource:action` scopes.\n\n- Resources: `customer`, `invoice`, `payment`, `webhook`, `api_key`\n- Actions: `read`, `create`, `update`, `delete`\n- `*` is allowed on either side: `invoice:*`, `*:read`, `*:*`\n- Grants are additive; absence is denial.\n- Every mutating action implies `read` on the same resource (a credential\n  that may change a resource may see what it changed).\n\nEach operation below documents its required scope. A credential without it\nreceives `403` with `missing_permission` in the error body.\n\n## Money\n\nAll amounts are **integer minor units** (cents). There are no floats\nanywhere in the API.\n\n## Identifiers\n\nResources use prefixed ids: `cus_...` (customer), `inv_...` (invoice),\n`li_...` (line item), `pa_...` (payment attempt), `ak_...` (API key),\n`whe_...` (webhook endpoint), `whd_...` (webhook delivery), `evt_...`\n(event). Passing an id with the wrong prefix is a `400`, not a `404`.\n\n## Errors\n\nEvery error uses one envelope (see the `Error` schema):\n\n```json\n{ \"error\": { \"type\": \"invalid_state_transition\",\n             \"message\": \"cannot pay an invoice in state paid\",\n             \"status\": 409,\n             \"current_state\": \"paid\", \"attempted_transition\": \"pay\" } }\n```\n\n## Webhooks\n\nSee the `webhooks` section of `POST /webhook_endpoints` and the\n`WebhookEvent` schema for payload shape, signing, and retry policy.\n"},"servers":[{"url":"http://localhost:58080","description":"Local docker compose"}],"tags":[{"name":"Auth"},{"name":"API Keys"},{"name":"Customers"},{"name":"Invoices"},{"name":"Payments"},{"name":"Webhooks"}],"security":[{"bearerAuth":[]}],"paths":{"/healthz":{"get":{"summary":"Health check","security":[],"responses":{"200":{"description":"Service is up","content":{"text/plain":{"schema":{"type":"string","example":"ok"}}}}}}},"/auth/tokens":{"post":{"tags":["Auth"],"summary":"Mint a short-lived critical-tier token","description":"Trades a long-lived API key for a 15-minute JWT, optionally carrying a\n**subset** of the key's permissions. Requesting a scope the key does not\nhold is `403 missing_permission`. Only API keys may call this (a token\ncannot mint another token). **Scope required:** any live API key.\n","requestBody":{"required":false,"content":{"application/json":{"schema":{"type":"object","properties":{"permissions":{"type":"array","items":{"type":"string"},"description":"Subset of the calling key's permissions to embed. Omitted means everything the key holds.\n","example":["api_key:create"]}}}}}},"responses":{"200":{"description":"Token minted","content":{"application/json":{"schema":{"type":"object","required":["token","token_type","expires_at","expires_in","permissions"],"properties":{"token":{"type":"string","description":"The JWT. Use as `Authorization Bearer <token>`."},"token_type":{"type":"string","const":"Bearer"},"expires_at":{"type":"integer","description":"Unix timestamp (seconds)."},"expires_in":{"type":"i ed_at` is set) but the row is\nkept as audit trail. Revoking an already-revoked key is a no-op that\nreturns the key.\n","security":[{"criticalToken":[]}],"parameters":[{"$ref":"#/components/parameters/apiKeyId"}],"responses":{"200":{"description":"The revoked key","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiKey"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/customers":{"post":{"tags":["Customers"],"summary":"Create a customer","description":"**Scope:** `customer:create`","requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["name","email"],"properties":{"name":{"type":"string","example":"Ada Lovelace"},"email":{"type":"string","example":"ada@example.com"}}}}}},"responses":{"201":{"description":"Created","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Customer"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}},"get":{"tags":["Customers"],"summary":"List customers","description":"**Scope:** `customer:read`. Newest first, cursor-paginated.","parameters":[{"$ref":"#/components/parameters/limit"},{"$ref":"#/components/parameters/startingAfter"}],"responses":{"200":{"description":"Customers","content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/List"},{"properties":{"data":{"type":"array","items":{"$ref":"#/components/schemas/Customer"}}}}]}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}}},"/customers/{id}":{"get":{"tags":["Customers"],"summary":"Get a customer","description":"**Scope:** `customer:read`","parameters":[{"$ref":"#/components/parameters/customerId"}],"responses":{"200":{"description":"The customer","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Customer"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/invoices":{"post":{"tags":["Invoices"],"summary":"Create an invoice (draft)","description":"**Scope:** `invoice:create`. The invoice is created in `draft` and its\n`total_cents` is **computed by the server** from the line items; a\nclient-supplied total is never accepted. 1\u2013500 line items; the total\nmust be greater than zero.\n","requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["customer_id","due_date","line_items"],"properties":{"customer_id":{"type":"string","example":"cus_0192f0a1b2c34567890abcdef0123456"},"due_date":{"type":"string","format":"date","example":"2026-10-01"},"currency":{"type":"string","description":"Three-letter code. Defaults to `usd`.","example":"usd"},"line_items":{"type":"array","minItems":1,"maxItems":500,"items":{"type":"object","required":["description","quantity","unit_amount_cents"],"properties":{"description":{"type":"string","example":"Consulting"},"quantity":{"type":"integer","minimum":1,"example":10},"unit_amount_cents":{"type":"integer","minimum":0,"example":15000}}}}}}}}},"responses":{"201":{"description":"Created, with line items. Emits `invoice.created`.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Invoice"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}},"get":{"tags":["Invoices"],"summary":"List invoices","description":"**Scope:** `invoice:read`. Newest first, cursor-paginated.","parameters":[{"name":"state","in":"query","schema":{"type":"string","enum":["draft","sent","partially_paid","paid","void","refunded"]}},{"name":"overdue","in":"query","description":"`true` returns only invoices past their due date that are still collectible (`sent`/`partially_paid`); `false` only those that are not. Overdue is computed, not stored.\n","schema":{"type":"boolean"}},{"name":"customer_id","in":"query","schema":{"type":"string"}},{"$ref":"#/components/parameters/limit"},{"$ref":"#/components/parameters/startingAfter"}],"responses":{"200":{"description":"Invoices (without line items)","content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/List"},{"properties":{"data":{"type":"array","items":{"$ref":"#/components/schemas/Invoice"}}}}]}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}}},"/invoices/{id}":{"get":{"tags":["Invoices"],"summary":"Get an invoice","description":"**Scope:** `invoice:read`. Includes line items and every payment\nattempt (newest first) \u2014 this is the endpoint to poll after a `202`\npayment response.\n","parameters":[{"$ref":"#/components/parameters/invoiceId"}],"responses":{"200":{"description":"The invoice with `line_items` and `payment_attempts`","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Invoice"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/invoices/{id}/send":{"post":{"tags":["Invoices"],"summary":"Send an invoice (draft \u2192 sent)","description":"**Scope:** `invoice:update`. Only a `draft` can be sent. Emits\n`invoice.sent`. Any other state is `409 invalid_state_transition`.\n","parameters":[{"$ref":"#/components/parameters/invoiceId"}],"responses":{"200":{"description":"The invoice, now `sent`","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Invoice"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"}}}},"/invoices/{id}/void":{"post":{"tags":["Invoices"],"summary":"Void an invoice","description":"**Scope:** `invoice:update`. Void is reachable only from `draft` and\n`sent`, and only while `amount_paid_cents = 0` \u2014 once any money has\nmoved the invoice is part of the money trail and cannot be voided.\nEmits `invoice.voided`.\n","parameters":[{"$ref":"#/components/parameters/invoiceId"}],"responses":{"200":{"description":"The invoice, now `void`","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Invoice"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"}}}},"/invoices/{id}/pay":{"post":{"tags":["Payments"],"summary":"Pay an invoice","description":"**Scope:** `payment:create`. Charges the full remaining balance\nthrough a payment processor. Only `sent` and `partially_paid`\ninvoices are payable.\n\nThe **`Idempotency-Key` header is required**. Replaying the same key\nwith the same body returns the stored response byte-for-byte without a\nsecond charge; the same key with a *different* body is\n`422 idempotency_key_reuse`.\n\nAt most one payment attempt per invoice may be in flight: a concurrent\nsecond request gets `409 payment_in_progress`.\n\nOutcomes:\n- **200** \u2014 the charge succeeded; the response is the payment attempt\n  with the updated invoice embedded.\n- **402 payment_failed** \u2014 the processor gave a definitive decline\n  (`code` such as `insufficient_funds`, `card_declined`). The invoice\n  is unchanged and stays payable.\n- **202** \u2014 the processor did not give a definitive outcome (timeout /\n  network error). The attempt stays `pending` and a background\n  reconciler resolves it; poll `GET /invoices/{id}`. **Do not retry\n  with a new idempotency key** \u2014 the original charge may still\n  succeed.\n","parameters":[{"$ref":"#/components/parameters/invoiceId"},{"name":"Idempotency-Key","in":"header","required":true,"schema":{"type":"string","maxLength":255},"description":"Unique per logical payment request. Required."}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["card_token"],"properties":{"card_token":{"type":"string","description":"Card token. The mock PSPs interpret magic tokens:\n`tok_success`, `tok_insufficient_funds`,\n`tok_card_declined`, `tok_timeout` (30 s then success),\n`tok_network_error` (dropped connection). Anything else\nsucceeds.\n","example":"tok_success"},"processor":{"type":"string","description":"`alphapay` (default) or `betapay`.","example":"alphapay"}}}}}},"responses":{"200":{"description":"Charge succeeded (or a replayed success)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/PaymentResult"}}}},"202":{"description":"Outcome unknown; attempt is `pending` and being reconciled","content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/PaymentResult"},{"properties":{"message":{"type":"string"}}}]}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"402":{"description":"Definitive decline","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"},"example":{"error":{"type":"payment_failed","message":"payment failed: card_declined","status":402,"code":"card_declined","payment_attempt_id":"pa_0192f0a1b2c34567890abcdef0123456"}}}}},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"description":"`payment_in_progress` (another attempt is in flight), `invoice_already_paid`, `nothing_to_pay`, `request_in_progress` (same idempotency key still being processed), or `invalid_state_transition` (e.g. paying a draft).\n","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"Idempotency key reused with a different request body","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}}},"/webhook_endpoints":{"post":{"tags":["Webhooks"],"summary":"Register a webhook endpoint","description":"**Critical tier**; **scope:** `webhook:create`. The signing `secret`\n(`whsec_...`) is returned once, at registration, and never again.\nThere is no rotate endpoint: register a new endpoint and disable the\nold one.\n\n### Delivery\n\nEvents are delivered as `POST <url>` with headers:\n\n```\nWebhook-Id:        evt_...   (stable across retries \u2014 deduplicate on it)\nWebhook-Timestamp: 1772035200\nWebhook-Signature: v1=<hex HMAC-SHA256(secret, \"{timestamp}.{raw body}\")>\n```\n\nVerify by recomputing the HMAC over `\"{Webhook-Timestamp}.{raw body}\"`\nwith your secret, comparing in constant time, and rejecting timestamps\nolder than 5 minutes (replay protection).\n\nAny 2xx within 10 s counts as delivered. Failures are retried at ~5 s,\n30 s, 2 m, 10 m, 30 m, 2 h (7 attempts total, jittered, ~2.7 h\nbudget); after that the delivery is `exhausted` and visible via\n`GET /webhook_deliveries`. Delivery is at-least-once and decoupled from\nthe API request path.\n\nEvent types: `invoice.created`, `invoice.sent`, `invoice.paid`,\n`invoice.payment_failed`, `invoice.voided`. See `WebhookEvent`.\n","security":[{"criticalToken":[]}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["url"],"properties":{"url":{"type":"string","example":"https://example.com/webhooks"}}}}}},"responses":{"201":{"description":"Registered. `secret` is present on this response only.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/WebhookEndpoint"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}},"get":{"tags":["Webhooks"],"summary":"List webhook endpoints","description":"**Scope:** `webhook:read`. Secrets are never returned.","parameters":[{"$ref":"#/components/parameters/limit"},{"$ref":"#/components/parameters/startingAfter"}],"responses":{"200":{"description":"Endpoints","content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/List"},{"properties":{"data":{"type":"array","items":{"$ref":"#/components/schemas/WebhookEndpoint"}}}}]}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}}},"/webhook_endpoints/{id}":{"delete":{"tags":["Webhooks"],"summary":"Disable a webhook endpoint","description":"**Critical tier**; **scope:** `webhook:delete`. Disable, not delete:\npast delivery rows are kept as audit trail. No further events are\nqueued for a disabled endpoint.\n","security":[{"criticalToken":[]}],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string"},"example":"whe_0192f0a1b2c34567890abcdef0123456"}],"responses":{"200":{"description":"The endpoint, now disabled","content":{"application/json":{"schema":{"$ref":"#/components/schemas/WebhookEndpoint"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/webhook_deliveries":{"get":{"tags":["Webhooks"],"summary":"List webhook deliveries","description":"**Scope:** `webhook:read`. The answer to \"did that webhook arrive?\" \u2014\nshows status, attempt count, last error, and next retry time for every\nqueued event.\n","parameters":[{"name":"status","in":"query","schema":{"type":"string","enum":["pending","delivering","delivered","exhausted"]}},{"name":"event_type","in":"query","schema":{"type":"string","example":"invoice.paid"}},{"$ref":"#/components/parameters/limit"},{"$ref":"#/components/parameters/startingAfter"}],"responses":{"200":{"description":"Deliveries, newest first","content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/List"},{"properties":{"data":{"type":"array","items":{"$ref":"#/components/schemas/WebhookDelivery"}}}}]}}}}
